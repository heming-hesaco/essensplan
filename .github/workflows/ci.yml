name: CI
on:
  push:
  pull_request:
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  datenbank:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.010
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Speicher vorbereiten (nur Wegwerf-Datenbank)
        run: psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/_speicher_vorbereiten.sql
      - name: Migrationen
        run: for f in supabase/migrations/*.sql; do psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Zugriffsrechte
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/haushalt.sql | tee ausgabe.txt && grep -q "ALLE PRÜFUNGEN BESTANDEN" ausgabe.txt
